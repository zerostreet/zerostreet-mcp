[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerostreet-mcp"
version = "0.1.0"
description = "ZeroStreet FastMCP Server, MIT Agent Skills, and DeepAgents Build-Time Architect"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.0",
    "deepagents>=0.6.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "zerostreet-schema",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
zerostreet-mcp = "zerostreet_mcp.foundry_mcp:main"
zerostreet-foundry-mcp = "zerostreet_mcp.foundry_mcp:main"

[tool.uv.sources]
zerostreet-schema = { path = "../zerostreet-schema", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zerostreet_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
